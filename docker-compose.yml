services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalogsense
      POSTGRES_USER: catalogsense
      POSTGRES_PASSWORD: catalogsense
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogsense"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/catalogsense
    ports:
      - "8080:8080"

  # Phase 2: kafka (ingestion queue) and opensearch (search index) will be added here.
