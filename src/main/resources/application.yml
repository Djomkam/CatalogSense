spring:
  application:
    name: catalogsense
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalogsense}
    username: ${DB_USER:catalogsense}
    password: ${DB_PASSWORD:catalogsense}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

catalogsense:
  outbox:
    topic: catalogsense.product-events
    partitions: 3
    retention: 7d
    relay:
      enabled: true
      batch-size: 100
      poll-interval: 500ms
      send-timeout: 10s
  search:
    enabled: true
    url: ${OPENSEARCH_URL:http://localhost:9200}
    index: catalogsense-products
    consumer:
      group-id: catalogsense-search-indexer
      retries: 3
      retry-backoff: 1s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
