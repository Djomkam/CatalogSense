spring:
  datasource:
    url: jdbc:h2:mem:catalogsense;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  kafka:
    bootstrap-servers: localhost:65530
    admin:
      auto-create: false

# Most tests only check the outbox table; OutboxRelayIntegrationTest turns the relay on with an embedded broker.
catalogsense:
  outbox:
    relay:
      enabled: false
